<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} — {{ site.description }}{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <link rel="canonical" href="{{ site.url }}{{ page.url | replace:'index.html','' }}">

  <!-- Preload fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/layout.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/components.css' | relative_url }}">

  <!-- Page-specific CSS -->
  {% if page.style %}<style>{{ page.style }}</style>{% endif %}

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">

  {% if page.noindex %}<meta name="robots" content="noindex,nofollow">{% endif %}

  <!-- Open Graph -->
  <meta property="og:title" content="{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ site.url }}{{ page.url | replace:'index.html','' }}">
  <meta property="og:site_name" content="{{ site.title }}">

  <!-- Schema.org -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LocalBusiness",
    "@id": "{{ site.url }}/#business",
    "name": "{{ site.title }}",
    "description": "{{ site.description }}",
    "url": "{{ site.url }}",
    "telephone": "+{{ site.data.city.phone_raw }}",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "{{ site.data.city.name }}",
      "addressCountry": "RU"
    },
    "openingHours": "Mo-Su 00:00-23:59",
    "priceRange": "от 1600₽",
    "areaServed": {
      "@type": "City",
      "name": "{{ site.data.city.name }}"
    }
  }
  </script>
</head>
<body>
  {% include header.html %}

  <main>
    {{ content }}
  </main>

  {% include footer.html %}

  <!-- City geo-switcher: full text replacement -->
  <script>
  (function() {
    var CITY_KEY = 'dez-city-v2';
    var REPLACEMENTS = {
      penza: {
        'Пенза': 'Пенза',
        'Пензы': 'Пензы',
        'в Пензе': 'в Пензе',
        'Пенза и Пензенская область': 'Пенза и Пензенская область',
        'Пензенская область': 'Пензенская область',
        '+7 (8412) 25-01-77': '+7 (8412) 25-01-77',
        '78412250177': '78412250177',
        'Ленинский': 'Ленинский',
        'Октябрьский': 'Октябрьский',
        'Первомайский': 'Первомайский',
        'Железнодорожный': 'Железнодорожный',
        'Арбеково': 'Арбеково',
        'Терновка': 'Терновка',
        'Засечное': 'Засечное',
        'Спутник': 'Спутник'
      },
      moskva: {
        'Пенза': 'Москва',
        'Пензы': 'Москвы',
        'в Пензе': 'в Москве',
        'Пенза и Пензенская область': 'Москва и Московская область',
        'Пензенская область': 'Московская область',
        '+7 (8412) 25-01-77': '+7 (495) 123-45-67',
        '78412250177': '74951234567',
        'Ленинский': 'ЦАО',
        'Октябрьский': 'САО',
        'Первомайский': 'ЮВАО',
        'Железнодорожный': 'ЮЗАО',
        'Арбеково': 'ЗАО',
        'Терновка': 'ТиНАО',
        'Засечное': 'МО',
        'Спутник': 'СЗАО'
      }
    };

    var currentCity = 'penza';
    var saved = localStorage.getItem(CITY_KEY);

    function applyReplacements(fromCity, toCity) {
      var map = REPLACEMENTS[toCity];
      if (!map) return;

      // Walk all text nodes
      var walker = document.createTreeWalker(
        document.body,
        NodeFilter.SHOW_TEXT,
        null,
        false
      );

      var textNodes = [];
      while (walker.nextNode()) {
        textNodes.push(walker.currentNode);
      }

      textNodes.forEach(function(node) {
        var text = node.textContent;
        var changed = false;
        Object.keys(map).forEach(function(from) {
          if (text.indexOf(from) !== -1) {
            text = text.split(from).join(map[from]);
            changed = true;
          }
        });
        if (changed) {
          node.textContent = text;
        }
      });

      // Update tel: links
      var phoneFrom = REPLACEMENTS[fromCity]['78412250177'] || '78412250177';
      var phoneTo = REPLACEMENTS[toCity]['78412250177'] || '78412250177';
      document.querySelectorAll('a[href*="' + phoneFrom + '"]').forEach(function(a) {
        a.href = a.href.replace(phoneFrom, phoneTo);
      });

      currentCity = toCity;
    }

    // Apply saved city preference
    if (saved && saved !== currentCity) {
      applyReplacements('penza', saved);
    }

    // Detect city from IP
    if (!saved) {
      fetch('https://ipapi.co/json/')
        .then(function(r) { return r.json(); })
        .then(function(data) {
          var region = (data.region || '').toLowerCase();
          var cityName = (data.city || '').toLowerCase();
          // Moscow city or Moscow region
          if ((cityName === 'moscow' || region === 'moscow' || region === 'moskovskaya oblast') && currentCity === 'penza') {
            showCityBanner('moskva');
          }
        })
        .catch(function() {});
    }

    function showCityBanner(toCity) {
      var labels = { moskva: 'Москве', penza: 'Пензе' };
      var banner = document.createElement('div');
      banner.className = 'city-banner';
      banner.innerHTML = '<div class="city-banner__inner container">' +
        '<span class="city-banner__text">Вы в ' + labels[toCity] + '? Показать версию сайта для ' + labels[toCity] + ' — другие цены, контакты, условия.</span>' +
        '<div class="city-banner__actions">' +
        '<button class="city-banner__btn" data-city="' + toCity + '">Да, переключить</button>' +
        '<button class="city-banner__close">&times;</button>' +
        '</div></div>';
      document.body.insertBefore(banner, document.body.firstChild);
      document.body.classList.add('has-city-banner');

      banner.querySelector('[data-city]').addEventListener('click', function() {
        applyReplacements(currentCity, toCity);
        localStorage.setItem(CITY_KEY, toCity);
        banner.remove();
        document.body.classList.remove('has-city-banner');
      });

      banner.querySelector('.city-banner__close').addEventListener('click', function() {
        banner.remove();
        document.body.classList.remove('has-city-banner');
      });
    }

    // Manual city picker in header (click on city name)
    document.addEventListener('DOMContentLoaded', function() {
      var picker = document.createElement('span');
      picker.className = 'city-picker';
      picker.textContent = 'Пенза';
      picker.title = 'Сменить город';
      picker.style.cssText = 'cursor:pointer;font-family:var(--font-mono);font-size:var(--text-xs);color:var(--color-accent);margin-left:8px;padding:2px 8px;border:1px solid var(--color-accent);border-radius:50px;white-space:nowrap;transition:all var(--transition)';
      picker.addEventListener('mouseenter', function() { this.style.background = 'var(--color-accent)'; this.style.color = 'var(--color-base)'; });
      picker.addEventListener('mouseleave', function() { this.style.background = ''; this.style.color = 'var(--color-accent)'; });

      picker.addEventListener('click', function() {
        var newCity = currentCity === 'penza' ? 'moskva' : 'penza';
        applyReplacements(currentCity, newCity);
        localStorage.setItem(CITY_KEY, newCity);
        picker.textContent = newCity === 'penza' ? 'Пенза' : 'Москва';
        location.reload();
      });

      // Add picker next to logo
      var logo = document.querySelector('.header__logo');
      if (logo) logo.appendChild(picker);
    });
  })();
  </script>

  <style>
  .city-banner{background:rgba(245,158,11,0.12);border-bottom:1px solid rgba(245,158,11,0.2);padding:var(--space-3) 0;position:relative;z-index:101}
  .city-banner__inner{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap}
  .city-banner__text{font-size:var(--text-sm);color:var(--color-accent-alt)}
  .city-banner__actions{display:flex;align-items:center;gap:var(--space-3);flex-shrink:0}
  .city-banner__btn{font-family:var(--font-display);font-size:var(--text-sm);font-weight:600;padding:6px 14px;background:var(--color-accent-alt);color:var(--color-base);border:none;border-radius:50px;cursor:pointer;white-space:nowrap;transition:all var(--transition)}
  .city-banner__btn:hover{background:color-mix(in srgb,var(--color-accent-alt) 85%,white);transform:translateY(-1px)}
  .city-banner__close{background:none;border:none;color:var(--color-text-muted);font-size:20px;cursor:pointer;padding:0;line-height:1}
  .has-city-banner .header{top:44px}
  @media(max-width:768px){.city-banner__inner{flex-direction:column;text-align:center}}
  </style>

  <!-- Scroll reveal -->
  <script>
  (function() {
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('reveal--visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -30px 0px' });

    document.querySelectorAll('.reveal').forEach(function(el) {
      observer.observe(el);
    });
  })();
  </script>
</body>
</html>
