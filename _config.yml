title: Дез Обработка
description: Профессиональная дезинсекция в Пензе. Холодный туман, безопасные препараты 4-го класса.
baseurl: ""
url: "https://dez-obrabotka.pro"

# Город (для frontmatter — дублируется в _data/city.yml для JS)
city_name: Пенза
city_name_prep: в Пензе
city_name_gen: Пензы
city_region: Пензенская область
city_prefix: Пенза и Пензенская область
city_phone: +7 (902) 203-00-15
city_phone_raw: 79022030015
city_address: г. Пенза, ул. Беляева, 2

plugins:
  - jekyll-sitemap

# Exclude internal files from build
exclude:
  - CLAUDE.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - .gitignore
  - build-penza.sh
  - build-moskva.sh
  - design-dna.json
  - semantic-core.json
  - docs/
  - .claude/
  - node_modules/
  - screenshot*.png

# Чистые URL без .html
permalink: /blog/:title/
